name: Pointone
description: >-
  PointOne is an AI-powered legal practice management platform that automates
  time entry, billing compliance, and analytics for law firms. Its products
  include PointOne Time (automatic cross-device time capture with AI-generated
  narratives), PointOne Review (pre-bill review with AI markup and collaboration),
  and PointOne Intelligence (time analytics and resource-allocation insights),
  along with automatic enforcement of Outside Counsel Guidelines. The platform
  syncs with billing systems including Aderant, Clio, Filevine, QuickBooks,
  Actionstep, Elite 3E, Surepoint, MyCase, and LeanLaw, and serves 200+ law
  firms. PointOne is backed by Bessemer, Y Combinator, General Catalyst, and 8VC.
  No public developer API is currently published; integrations are delivered as
  pre-built connectors.
